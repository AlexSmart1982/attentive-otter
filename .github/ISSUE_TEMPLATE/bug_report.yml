name: Bug report
description: Report an application problem
title: "[Bug] "
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Application version
      placeholder: 1.0 BETA / v1.0.0-beta.1
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system and architecture
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
    validations:
      required: true
  - type: textarea
    id: result
    attributes:
      label: Expected and actual result
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: Logs or synthetic sample
      description: Remove private paths and metadata before sharing. Report possible security or data-integrity issues by the contact in SECURITY.md.
