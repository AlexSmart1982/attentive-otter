name: macOS build and tests
on:
  push:
    branches: [main]
  workflow_dispatch:
defaults:
  run:
    shell: bash
permissions:
  contents: read
jobs:
  macos:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            architecture: arm64
          - runner: macos-15-intel
            architecture: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 45
    env:
      QT_QPA_PLATFORM: offscreen
      MPLBACKEND: Agg
      PYTHONUTF8: "1"
      MACOSX_DEPLOYMENT_TARGET: "14.0"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0
        with:
          python-version: "3.13.8"
          architecture: ${{ matrix.architecture }}
          cache: pip
          cache-dependency-path: requirements-macos.txt
      - name: Install dependencies
        run: python -m pip install -r requirements-macos.txt
      - name: Cache native OpenCV wheel
        id: opencv-cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/attentive_otter_opencv_v1
          key: opencv-image-only-v1-${{ matrix.architecture }}-${{ hashFiles('build_macos_opencv.py') }}
      - name: Build image-processing dependency
        run: python -B build_macos_opencv.py
      - name: Preserve built wheel for retries
        if: steps.opencv-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: ~/.cache/attentive_otter_opencv_v1
          key: opencv-image-only-v1-${{ matrix.architecture }}-${{ hashFiles('build_macos_opencv.py') }}
      - name: Record native runtime versions
        run: |
          python -c "import cv2,pillow_heif;from PyQt5.QtCore import qVersion;print(qVersion());print(pillow_heif.libheif_info());print(cv2.getBuildInformation())"
      - name: Run full regression suite
        run: python -B -X faulthandler .github/scripts/run_macos_tests.py 2>&1 | tee tests-macos.log
      - name: Build and verify app bundle
        run: python -B build_macos.py
      - name: Upload verification and bundle
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: macOS-${{ matrix.architecture }}
          path: |
            tests-macos.log
            release/*.zip
            release/archive-check-*.json
          retention-days: 14
